<script>
(function(){
  function initClean(){
    if(!window.firebase?.database){ setTimeout(initClean, 300); return; }
    const db = window.firebase.database();
    window.$i = function(chave, valor){
      try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch(e){}
      db.ref(chave).set(valor);
    };
    // Se não tem nada, cria vazio
    if(!localStorage.getItem("wms_final_ruas")){
      const ruas = Array.from({length:20}, (_,i)=>({nome: `Rua ${String(i+1).padStart(2,"0")}`}));
      localStorage.setItem("wms_final_ruas", JSON.stringify(ruas));
      window.$i("wms_final_ruas", ruas);
    }
    if(!localStorage.getItem("wms_final_materiais")){
      localStorage.setItem("wms_final_materiais", JSON.stringify([]));
    }
    if(!localStorage.getItem("wms_final_posicoes")){
      const pos = [];
      for(let r=0;r<20;r++) for(let n=1;n<=7;n++) for(let d=1;d<=10;d++) pos.push({posId: `${r}-${n}-${d}`, ruaIndex: r, nivel: n, div: d, itens: []});
      localStorage.setItem("wms_final_posicoes", JSON.stringify(pos));
      window.$i("wms_final_posicoes", pos);
    }
    console.log("🟢 Projeto zerado pronto");
  }
  initClean();
})();
</script>
